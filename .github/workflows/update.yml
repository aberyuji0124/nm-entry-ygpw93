name: 日程を更新する

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 朝6時（日本時間）に1回
  workflow_dispatch:        # 管理者が手動で実行するとき

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 公式サイトから日程を取り込む
        run: python tools/fetch_schedule.py
      - name: 変更があれば保存する（取得に失敗しても、失敗の記録は保存する）
        if: always()
        run: |
          git config user.name "nm-bot"
          git config user.email "nm-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "日程データを更新"
          git push
